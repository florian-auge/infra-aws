name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Se connecter à EC2 et déployer
        uses: appleboy/ssh-action@v1.0.3
        env:
          RDS_ENDPOINT: ${{ secrets.RDS_ENDPOINT }}
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
          RDS_USER: ${{ secrets.RDS_USER }}
          RDS_DATABASE: ${{ secrets.RDS_DATABASE }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: RDS_ENDPOINT,RDS_PASSWORD,RDS_USER,RDS_DATABASE
          request_pty: true
          script: |
            cd infra-aws
            git pull
            mysql --protocol=TCP -h $RDS_ENDPOINT -u admin -p$RDS_PASSWORD devops_trainer < database/devops_trainer_data.sql
            cd docker
            sudo docker build -t flask-app .
            sudo docker stop $(sudo docker ps -q) || true
            sudo docker run -d -p 5000:5000 \
              -e RDS_ENDPOINT=$RDS_ENDPOINT \
              -e RDS_USER=$RDS_USER \
              -e RDS_PASSWORD=$RDS_PASSWORD \
              -e RDS_DATABASE=$RDS_DATABASE \
              flask-app